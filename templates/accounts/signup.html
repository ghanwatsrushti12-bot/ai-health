{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block content %}
<section class="cp-section">
    <div class="container" style="max-width: 560px;">
        <div class="cp-form-card cp-animate-in">
            <div class="text-center mb-4">
                <h1 class="h4">Create your patient account</h1>
                <p class="text-muted small">Book appointments and track your care in minutes.</p>
            </div>
            <form method="post">
                {% csrf_token %}
                {% include "includes/_form.html" with form=form %}
                <button type="submit" class="btn cp-btn-primary w-100 mt-2">Create account</button>
            </form>
            <p class="text-center small text-muted mt-3 mb-0">
                Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>
            </p>
        </div>
    </div>
</section>
{% endblock %}
