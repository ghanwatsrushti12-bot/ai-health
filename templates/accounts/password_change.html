{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<section class="cp-section">
    <div class="container" style="max-width: 480px;">
        <div class="cp-form-card">
            <h1 class="h4 mb-4">Change password</h1>
            <form method="post">
                {% csrf_token %}
                {% include "includes/_form.html" with form=form %}
                <button type="submit" class="btn cp-btn-primary w-100">Update password</button>
            </form>
        </div>
    </div>
</section>
{% endblock %}
