{% extends "dashboard/_dashboard_base.html" %}
{% block page_title %}{% if object %}Edit Doctor{% else %}Add Doctor{% endif %}{% endblock %}
{% block dashboard_content %}
<div class="cp-form-card" style="max-width: 720px;">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% include "includes/_form.html" with form=form %}
        <button type="submit" class="btn cp-btn-primary px-4">Save doctor</button>
        <a href="{% url 'doctors:manage_list' %}" class="btn cp-btn-outline px-4">Cancel</a>
    </form>
</div>
{% endblock %}
