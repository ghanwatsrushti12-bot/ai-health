{% extends "dashboard/_dashboard_base.html" %}
{% block page_title %}Update Appointment Status{% endblock %}
{% block dashboard_content %}
<div class="cp-form-card" style="max-width: 520px;">
    <form method="post">
        {% csrf_token %}
        {% include "includes/_form.html" with form=form %}
        <button type="submit" class="btn cp-btn-primary px-4">Save</button>
        <a href="{% url 'appointments:detail' object.pk %}" class="btn cp-btn-outline px-4">Cancel</a>
    </form>
</div>
{% endblock %}
