{% extends "base.html" %}
{% block title %}Request received{% endblock %}
{% block content %}
<section class="cp-section">
    <div class="container text-center" style="max-width: 520px;">
        <div class="cp-form-card">
            <div class="cp-feature-icon mx-auto" style="background:#e6f7ee; color:var(--cp-success);"><i class="bi bi-check-circle"></i></div>
            <h1 class="h4 mb-2">Ambulance request received</h1>
            <p class="text-muted mb-4">Our dispatch team has been notified and will contact you shortly at the number you provided.</p>
            <a href="{% url 'core:landing' %}" class="btn cp-btn-primary w-100">Back to home</a>
        </div>
    </div>
</section>
{% endblock %}
