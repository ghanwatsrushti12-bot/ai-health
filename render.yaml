services:
  - type: web
    name: carepulse
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn -c gunicorn.conf.py carepulse.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: carepulse.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: carepulse-db
          property: connectionString

databases:
  - name: carepulse-db
    plan: free
